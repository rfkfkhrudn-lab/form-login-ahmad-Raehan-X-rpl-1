<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Daftar</title>

    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet">

    <style>
     .full-page-gradient {
        height: 100vh;
        background: linear-gradient(135deg, #1713f0 0%, #4bd6e9 100%);
        display: flex;
        justify-content: center;
        align-items: center;
     }
    </style>
</head>

<body class="full-page-gradient">

<script>
    window.alert("Selamat datang di halaman daftar!");
</script>   

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card p-4">
                <div class="card-body">
                    
                    <h4 class="text-center mb-4">FORM DAFTAR</h4>

                    <form>
                    
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" placeholder="Masukkan username">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="email" class="form-control" placeholder="Masukkan Password">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Konfirmasi Password</label>
                            <input type="password" class="form-control" placeholder="Konfirmasi password">
                        </div>

                        <div class="d-grid gap-2 mb-3">
                            <button type="submit" class="btn btn-primary">DAFTAR</button>
                            <button type="reset" class="btn btn-danger">RESET</button>
                        </div> 

                        <p class="text-center">
                            Sudah punya akun? 
                            <a href="apan aja .html">Login di sini</a>
                        </p>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
